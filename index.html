<div class="img-magnifier-container">
	
	<img id="myimage" src="assets/img/mosaic_5.jpg">
	
<script>
(function() {
  var img = document.getElementById("myimage");
  var zoom = 15, bw = 3;
  var glass = document.createElement("DIV");
  glass.setAttribute("class", "img-magnifier-glass");
  glass.style.display = "none";
  img.parentElement.insertBefore(glass, img);

  function setup() {
    glass.style.backgroundImage = "url('" + img.src + "')";
    glass.style.backgroundRepeat = "no-repeat";
    glass.style.backgroundSize = (img.width * zoom) + "px " + (img.height * zoom) + "px";
  }

  function getCursorPos(e) {
    var p = e.touches ? e.touches[0] : e;
    var a = img.getBoundingClientRect();
    return {x: p.clientX - a.left, y: p.clientY - a.top};
  }

  function moveMagnifier(e) {
    e.preventDefault();
    var pos = getCursorPos(e), x = pos.x, y = pos.y;
    var w = glass.offsetWidth / 2, h = glass.offsetHeight / 2;
    if (x < 0 || y < 0 || x > img.width || y > img.height) { glass.style.display = "none"; return; }
    glass.style.display = "block";
    /* keep the glass inside the image */
    if (x > img.width - (w / zoom)) {x = img.width - (w / zoom);}
    if (x < w / zoom) {x = w / zoom;}
    if (y > img.height - (h / zoom)) {y = img.height - (h / zoom);}
    if (y < h / zoom) {y = h / zoom;}
    var a = img.getBoundingClientRect(), c = img.parentElement.getBoundingClientRect();
    glass.style.left = (a.left - c.left + x - w) + "px";
    glass.style.top = (a.top - c.top + y - h) + "px";
    glass.style.backgroundPosition = "-" + ((x * zoom) - w + bw) + "px -" + ((y * zoom) - h + bw) + "px";
  }

  function hide() { glass.style.display = "none"; }

  [glass, img].forEach(function(el) {
    el.addEventListener("mousemove", moveMagnifier);
    el.addEventListener("touchmove", moveMagnifier, {passive: false});
  });
  glass.addEventListener("mouseleave", hide);
  glass.addEventListener("touchend", hide);
  window.addEventListener("resize", setup);

  if (img.complete) setup(); else img.addEventListener("load", setup);
})();
</script>
</div>
